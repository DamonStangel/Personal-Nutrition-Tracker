<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101713">
  <title>Daily Fuel — Nutrition Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#" aria-label="Daily Fuel home">
      <span class="brand-mark">df</span>
      <span>daily fuel</span>
    </a>

    <nav aria-label="Main navigation">
      <button class="nav-item active" type="button"><span>▦</span> Weekly log</button>
      <button class="nav-item" type="button"><span>◫</span> Food library</button>
      <button class="nav-item" type="button"><span>◒</span> Insights</button>
      <button class="nav-item" type="button"><span>⌁</span> Goals</button>
    </nav>

    <div class="sidebar-card">
      <div class="streak-icon">🔥</div>
      <div><strong>6 day streak</strong><small>Keep it rolling</small></div>
    </div>

    <div class="sidebar-footer">
      <div class="avatar">DS</div>
      <div><strong>Damon</strong><small>My nutrition plan</small></div>
      <button aria-label="Settings">•••</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">NUTRITION OVERVIEW</p>
        <h1>Weekly log</h1>
      </div>
      <div class="week-controls">
        <button id="prevWeek" class="icon-button" aria-label="Previous week">←</button>
        <button id="todayButton" class="date-button"><span id="weekLabel"></span><small>This week</small></button>
        <button id="nextWeek" class="icon-button" aria-label="Next week">→</button>
      </div>
      <button id="addFoodTop" class="primary-button"><span>＋</span> Add food</button>
    </header>

    <section class="goal-strip" aria-label="Weekly overview">
      <div class="goal-summary">
        <span class="goal-ring" id="goalRing"><strong id="weeklyPercent">0%</strong></span>
        <div><small>WEEKLY CALORIES</small><strong id="weeklyCalories">0 / 17,500</strong><p id="weeklySubtext">Loading your week…</p></div>
      </div>
      <div class="macro-summary"><span class="macro-dot protein"></span><div><small>AVG PROTEIN</small><strong id="avgProtein">0g</strong><p>Goal 180–200g</p></div></div>
      <div class="macro-summary"><span class="macro-dot carbs"></span><div><small>AVG CARBS</small><strong id="avgCarbs">0g</strong><p>Goal 250–300g</p></div></div>
      <div class="macro-summary"><span class="macro-dot fats"></span><div><small>AVG FATS</small><strong id="avgFats">0g</strong><p>Goal 65–75g</p></div></div>
      <button class="ghost-button" id="editGoals">Edit goals</button>
    </section>

    <section class="week-grid" id="weekGrid" aria-live="polite"></section>
  </main>

  <dialog id="foodDialog">
    <form id="foodForm" method="dialog">
      <div class="dialog-heading">
        <div><p class="eyebrow">QUICK ENTRY</p><h2>Add food</h2></div>
        <button class="close-button" value="cancel" formnovalidate aria-label="Close">×</button>
      </div>
      <label>Day<select id="foodDay" required></select></label>
      <label>Meal<select id="foodMeal" required><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option><option>Shake</option></select></label>
      <label class="full">Food name<input id="foodName" required placeholder="e.g. Chicken salad ranch"></label>
      <div class="nutrition-fields">
        <label>Calories<input id="foodCalories" type="number" min="0" required placeholder="450"></label>
        <label>Protein (g)<input id="foodProtein" type="number" min="0" step="0.1" required placeholder="48.5"></label>
        <label>Carbs (g)<input id="foodCarbs" type="number" min="0" step="0.1" required placeholder="8.5"></label>
        <label>Fat (g)<input id="foodFat" type="number" min="0" step="0.1" required placeholder="23.7"></label>
        <label>Sugar (g)<input id="foodSugar" type="number" min="0" step="0.1" required placeholder="1"></label>
      </div>
      <div class="dialog-actions"><button value="cancel" class="ghost-button" formnovalidate>Cancel</button><button id="saveFood" value="default" class="primary-button">Add to day</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
